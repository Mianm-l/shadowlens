version: "1.0"
rules:
  - id: "procurement_vs_receiving"
    name: "采购订单与入库验收对账规则"
    description: "核对已生效的采购订单是否在规定时限内完成入库质检，以及实收金额是否与订单金额一致"
    primary_table: "CT_PURCHASE_ORDER"
    primary_join_key: "ORDER_ID"
    secondary_table: "CT_RECEIVING_BILL"
    secondary_join_key: "REF_ORDER_ID"
    match_condition: "ORDER_STATUS = 2"
    discrepancy_types:
      - code: "MISSING_RECEIVING"
        name: "已审核采购单未入库"
        condition: "CT_RECEIVING_BILL.RECEIVE_ID IS NULL"
      - code: "AMOUNT_MISMATCH"
        name: "采购金额与实收金额存在偏差"
        condition: "ABS(CT_PURCHASE_ORDER.TOTAL_AMOUNT - CT_RECEIVING_BILL.ACTUAL_AMOUNT) > 0.01"

  - id: "receiving_vs_voucher"
    name: "入库单与财务应付凭证对账规则"
    description: "核对质检合格的入库单是否已及时同步生成财务中台应付凭证"
    primary_table: "CT_RECEIVING_BILL"
    primary_join_key: "RECEIVE_ID"
    secondary_table: "NC_PAY_VOUCHER"
    secondary_join_key: "SOURCE_BIZ_ID"
    match_condition: "INSPECT_STATUS = 2"
    discrepancy_types:
      - code: "MISSING_VOUCHER"
        name: "质检合格单尚未生成凭证"
        condition: "NC_PAY_VOUCHER.VOUCHER_ID IS NULL"
      - code: "UNPOSTED_VOUCHER"
        name: "凭证已创建但长期处于未过账状态"
        condition: "NC_PAY_VOUCHER.POST_STATUS = 0"
