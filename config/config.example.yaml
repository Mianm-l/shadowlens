# ShadowLens 配置示例模板
server:
  name: "shadowlens-oracle-mcp"
  host: "0.0.0.0"
  port: 8000
  transport: "sse" # 支持 "sse" (微服务网络端点) 或 "stdio" (本地命令行)

oracle:
  user: "SHADOW_RO"
  password: "YourReadOnlyPasswordHere"
  dsn: "192.168.1.100:1521/ORCLPDB1" # 格式: 主机:端口/服务名
  min_pool: 1
  max_pool: 5
  timeout_seconds: 5
  # dry_run_mode: 若为 true，在物理数据库不可达时自动启用内置业务仿真数据集
  dry_run_mode: true

security:
  max_rows_per_query: 200
  force_read_only_session: true
  mask_sensitive_data: true
  allowed_tables:
    - "CT_PURCHASE_ORDER"
    - "CT_RECEIVING_BILL"
    - "NC_PAY_VOUCHER"
    - "OA_COL_SUMMARY"
    - "OA_COL_AFFAIR"

paths:
  dictionary_file: "config/schema-dictionary.yaml"
  reconciliation_file: "config/reconciliation-rules.yaml"
