version: "1.0"
modules:
  - id: "procurement"
    name: "采购与物资管理模块"
    description: "涵盖采购订单、采购入库、验收状态及供应商对账核心表"
    tables:
      - table_name: "CT_PURCHASE_ORDER"
        alias: "采购订单主表"
        description: "记录采购订单基本信息、采购金额、审核状态"
        primary_key: "ORDER_ID"
        columns:
          - name: "ORDER_ID"
            chinese_name: "采购单号"
            type: "VARCHAR2(64)"
            description: "全局唯一业务主键"
          - name: "SUPPLIER_NAME"
            chinese_name: "供应商名称"
            type: "VARCHAR2(200)"
          - name: "CONTACT_PHONE"
            chinese_name: "联系电话"
            type: "VARCHAR2(32)"
            is_sensitive: true
            mask_type: "phone"
          - name: "TOTAL_AMOUNT"
            chinese_name: "订单总金额"
            type: "NUMBER(16,2)"
          - name: "ORDER_STATUS"
            chinese_name: "订单状态"
            type: "NUMBER(2)"
            enums:
              0: "草稿"
              1: "审批中"
              2: "已审批生效"
              3: "已作废"
          - name: "CREATE_TIME"
            chinese_name: "创建时间"
            type: "DATE"
          - name: "DEPT_NAME"
            chinese_name: "采购部门"
            type: "VARCHAR2(100)"
        relations:
          - target_table: "CT_RECEIVING_BILL"
            join_type: "LEFT"
            foreign_key: "ORDER_ID"
            target_key: "REF_ORDER_ID"
            description: "一个采购单可对应多次入库单"

      - table_name: "CT_RECEIVING_BILL"
        alias: "采购入库检验单"
        description: "入库实收数量、质检结果及库房接收记录"
        primary_key: "RECEIVE_ID"
        columns:
          - name: "RECEIVE_ID"
            chinese_name: "入库单号"
            type: "VARCHAR2(64)"
          - name: "REF_ORDER_ID"
            chinese_name: "关联采购单号"
            type: "VARCHAR2(64)"
          - name: "ACTUAL_AMOUNT"
            chinese_name: "实收核算金额"
            type: "NUMBER(16,2)"
          - name: "INSPECT_STATUS"
            chinese_name: "质检状态"
            type: "NUMBER(2)"
            enums:
              1: "待质检"
              2: "质检合格"
              3: "质检不合格"
          - name: "WAREHOUSE_NAME"
            chinese_name: "收货仓库"
            type: "VARCHAR2(100)"
          - name: "RECEIVE_TIME"
            chinese_name: "入库时间"
            type: "DATE"

  - id: "finance"
    name: "财务凭证与应付模块"
    description: "涵盖应付账款、发票核销及财务凭证表"
    tables:
      - table_name: "NC_PAY_VOUCHER"
        alias: "财务应付记账凭证"
        description: "用友或财务中台生成的正式凭证"
        primary_key: "VOUCHER_ID"
        columns:
          - name: "VOUCHER_ID"
            chinese_name: "凭证流水号"
            type: "VARCHAR2(64)"
          - name: "SOURCE_BIZ_ID"
            chinese_name: "来源业务单号"
            type: "VARCHAR2(64)"
            description: "通常关联采购单号或入库单号"
          - name: "VOUCHER_CODE"
            chinese_name: "凭证字号"
            type: "VARCHAR2(64)"
          - name: "VOUCHER_AMOUNT"
            chinese_name: "记账金额"
            type: "NUMBER(16,2)"
          - name: "POST_STATUS"
            chinese_name: "过账状态"
            type: "NUMBER(2)"
            enums:
              0: "未过账"
              1: "已记账"
              2: "已结账"
          - name: "POST_DATE"
            chinese_name: "过账日期"
            type: "DATE"

  - id: "collaboration_oa"
    name: "致远协同流程模块"
    description: "涵盖协同事项、审批节点及长流程待办"
    tables:
      - table_name: "OA_COL_SUMMARY"
        alias: "协同事项主表"
        description: "致远协同流程主表（公文/合同/费用等事项）"
        primary_key: "ID"
        columns:
          - name: "ID"
            chinese_name: "协同主键ID"
            type: "NUMBER(20)"
          - name: "SUBJECT"
            chinese_name: "协同标题"
            type: "VARCHAR2(300)"
          - name: "START_MEMBER_NAME"
            chinese_name: "发起人"
            type: "VARCHAR2(100)"
          - name: "START_DATE"
            chinese_name: "发起时间"
            type: "DATE"
          - name: "FINISH_DATE"
            chinese_name: "归档结束时间"
            type: "DATE"
          - name: "STATE"
            chinese_name: "协同状态"
            type: "NUMBER(2)"
            enums:
              0: "待发"
              1: "流转中"
              2: "正常结束"
              3: "撤销作废"
        relations:
          - target_table: "OA_COL_AFFAIR"
            join_type: "INNER"
            foreign_key: "ID"
            target_key: "OBJECT_ID"
            description: "协同主表关联各流转待办节点"

      - table_name: "OA_COL_AFFAIR"
        alias: "协同待办事项明细表"
        description: "记录每一位处理人的待办、已办状态与停留时间"
        primary_key: "ID"
        columns:
          - name: "ID"
            chinese_name: "待办流水ID"
            type: "NUMBER(20)"
          - name: "OBJECT_ID"
            chinese_name: "关联协同ID"
            type: "NUMBER(20)"
          - name: "MEMBER_NAME"
            chinese_name: "当前处理人"
            type: "VARCHAR2(100)"
          - name: "MEMBER_PHONE"
            chinese_name: "处理人手机"
            type: "VARCHAR2(32)"
            is_sensitive: true
            mask_type: "phone"
          - name: "STATE"
            chinese_name: "待办状态"
            type: "NUMBER(2)"
            enums:
              1: "待办/未读"
              2: "在办/已读"
              3: "已办/处理完毕"
              4: "暂存"
          - name: "RECEIVE_TIME"
            chinese_name: "到达时间"
            type: "DATE"
          - name: "COMPLETE_TIME"
            chinese_name: "办结时间"
            type: "DATE"
